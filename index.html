<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 교무실 - 선생님을 위한 업무 지원 도구</title>
    <!-- 마크다운 렌더링을 위한 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .section { margin-bottom: 20px; padding: 15px; background: #f9fbfa; border-radius: 8px; border: 1px solid #e1e8ed; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-save { background-color: #7f8c8d; }
        .btn-save:hover { background-color: #636e72; }
        .btn-generate { background-color: #3498db; font-size: 16px; }
        .btn-generate:hover { background-color: #2980b9; }
        .btn-generate:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .btn-copy { background-color: #27ae60; display: none; margin-top: 15px; }
        .btn-copy:hover { background-color: #2ecc71; }
        .help-link { display: inline-block; font-size: 13px; color: #3498db; margin-top: 5px; text-decoration: none; }
        .help-link:hover { text-decoration: underline; }
        #loading { display: none; text-align: center; color: #2980b9; font-weight: bold; margin: 15px 0; }
        #result-box { margin-top: 20px; padding: 20px; background: #fff; border: 2px solid #e1e8ed; border-radius: 8px; min-height: 150px; overflow-x: auto; line-height: 1.6; }
        #result-box table { border-collapse: collapse; width: 100%; margin-bottom: 15px; }
        #result-box th, #result-box td { border: 1px solid #bdc3c7; padding: 8px; text-align: left; }
        #result-box th { background-color: #f2f6f8; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏫 AI 교무실</h1>
    
    <!-- API 설정 영역 -->
    <div class="section">
        <label for="api-key">1. Gemini API 키 입력</label>
        <input type="password" id="api-key" placeholder="AIzaSy... 로 시작하는 API 키를 입력하세요">
        <div class="btn-group">
            <button class="btn-save" id="save-btn">내 브라우저에 API 키 저장하기</button>
        </div>
        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="help-link">👉 무료 Gemini API 키 발급받기 (클릭)</a>
    </div>

    <!-- 작업 설정 영역 -->
    <div class="section">
        <label for="task-type">2. 필요한 작업 선택</label>
        <select id="task-type">
            <option value="수업계획">📄 수업 계획서 작성</option>
            <option value="수행평가">📋 수행평가 및 채점 루브릭 작성</option>
            <option value="학생부">🖋️ 학생부 세특 문구 다듬기</option>
        </select>

        <label for="keyword" style="margin-top: 15px;">3. 핵심 키워드 입력 (단원명, 주제, 활동 등)</label>
        <input type="text" id="keyword" placeholder="예: 중3 과학 태양계, 고1 국어 윤동주 자화상">
        
        <button class="btn-generate" id="generate-btn">AI로 바로 만들기</button>
    </div>

    <!-- 결과 출력 영역 -->
    <div id="loading">AI가 선생님의 업무를 돕고 있습니다. 잠시만 기다려주세요... ⏳</div>
    
    <div id="result-box">결과가 이곳에 표시됩니다.</div>
    
    <button class="btn-copy" id="copy-btn">📋 한글(HWP) 및 워드 형식으로 복사하기</button>
</div>

<script>
    // HTML 요소 불러오기
    const apiKeyInput = document.getElementById('api-key');
    const saveBtn = document.getElementById('save-btn');
    const taskType = document.getElementById('task-type');
    const keywordInput = document.getElementById('keyword');
    const generateBtn = document.getElementById('generate-btn');
    const resultBox = document.getElementById('result-box');
    const copyBtn = document.getElementById('copy-btn');
    const loading = document.getElementById('loading');

    // 1. 브라우저에 저장된 API 키 불러오기 (자동 저장 기능)
    window.onload = () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }
    };

    // API 키 저장 버튼 기능
    saveBtn.onclick = () => {
        const key = apiKeyInput.value.trim();
        if (key) {
            localStorage.setItem('gemini_api_key', key);
            alert('API 키가 브라우저에 안전하게 저장되었습니다.\n다음 접속부터는 다시 입력하지 않으셔도 됩니다.');
        } else {
            alert('저장할 API 키를 먼저 입력해주세요.');
        }
    };

    // 2. 'AI로 바로 만들기' 버튼 기능 (배경 프롬프트 + 제미나이 API 호출)
    generateBtn.onclick = async () => {
        const apiKey = apiKeyInput.value.trim();
        const type = taskType.value;
        const keyword = keywordInput.value.trim();

        if (!apiKey) return alert('Gemini API 키를 입력해주세요.');
        if (!keyword) return alert('주제나 키워드를 입력해주세요.');

        // 버튼 잠금 및 로딩 화면 표시
        generateBtn.disabled = true;
        loading.style.display = 'block';
        resultBox.innerHTML = '';
        copyBtn.style.display = 'none';

        // 3. 교사를 위한 숨겨진 배경 프롬프트 세팅
        let prompt = "";
        if (type === '수업계획') {
            prompt = `주제: [${keyword}]\n\n당신은 한국의 수석 교사입니다. 위 주제를 바탕으로 2022 개정 교육과정 성취기준을 반영한 1차시 분량의 상세한 수업 지도안을 작성해 주세요. 도입-전개-정리 단계로 나누고, 가독성이 좋게 표 형식이나 글머리 기호를 활용해 주세요.`;
        } else if (type === '수행평가') {
            prompt = `주제: [${keyword}]\n\n당신은 한국의 수석 교사입니다. 위 주제를 바탕으로 학생들의 역량을 평가할 수 있는 수행평가 계획서와 구체적인 채점 기준표(루브릭)를 표 형태로 만들어 주세요. 5단계(A~E) 척도를 기준으로 작성해 주세요.`;
        } else if (type === '학생부') {
            prompt = `활동 내용: [${keyword}]\n\n당신은 꼼꼼한 교사입니다. 위 활동을 수행한 학생의 학교생활기록부 세부능력 및 특기사항(세특) 예시 문구를 수준별(상, 중, 하)로 3가지 작성해 주세요. 전문적인 교육 용어를 사용하고 문장이 매끄럽게 다듬어지도록 작성해 주세요.`;
        }

        // 제미나이 1.5 Flash API 호출 설정
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        const payload = {
            contents: [{ parts: [{ text: prompt }] }]
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || "알 수 없는 오류가 발생했습니다.");
            }

            const aiResponseText = data.candidates[0].content.parts[0].text;
            
            // 4. 마크다운을 한글/워드 친화적인 HTML로 렌더링
            resultBox.innerHTML = marked.parse(aiResponseText);
            
            // 복사 버튼 활성화
            copyBtn.style.display = 'block';

        } catch (error) {
            resultBox.innerHTML = `<span style="color:red; font-weight:bold;">[오류 발생]</span><br>${error.message}<br><br>API 키가 정확한지, 인터넷이 연결되어 있는지 확인해 주세요.`;
        } finally {
            // 작업 완료 후 로딩 끄기 및 버튼 잠금 해제
            loading.style.display = 'none';
            generateBtn.disabled = false;
        }
    };

    // 5. 한글(HWP) 서식 유지하며 복사하는 기능
    copyBtn.onclick = () => {
        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(resultBox);
        selection.removeAllRanges();
        selection.addRange(range);
        
        document.execCommand('copy');
        selection.removeAllRanges();
        
        alert('결과가 복사되었습니다!\n한글(HWP)이나 워드 파일에 붙여넣기(Ctrl+V) 하시면 표와 서식이 그대로 유지됩니다.');
    };
</script>

</body>
</html>
